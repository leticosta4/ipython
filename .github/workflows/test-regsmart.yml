name: Run pytest-regsmart

on:
  push:
    branches:
      - main
      - '*.x'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  REGSMART_PACKAGE: "git+https://github.com/leticosta4/pytest-regsmart@ca897d2b09104ba83e829fe81329be6b8d665afd"

jobs:
  test:
    name: regsmart (${{ matrix.mode }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          # Tests latest development Python version
          - python-version: "3.12"
            deps: test_extra
            mode: rgsm_qtf
            weight: "1-0"
            want-latest-entry-point-code: true
          - python-version: "3.12"
            deps: test_extra
            mode: rgsm_recentfail
            weight: "0-1"
            want-latest-entry-point-code: true
          - python-version: "3.12"
            deps: test_extra
            mode: rgsm_hybrid
            weight: "1-1"
            want-latest-entry-point-code: true
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        persist-credentials: false
        fetch-depth: 0
    - name: Set up Python 3.12
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
      with:
        python-version: "3.12"
        cache: pip
        cache-dependency-path: |
          pyproject.toml
    - name: Install uv
      uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
    - name: Install and update Python dependencies (binary only)
      if: ${{ ! contains( matrix.python-version, 'dev' ) }}
      run: |
        uv pip install --system setuptools wheel build
        uv pip install --system -e .[${{ matrix.deps }}]
        uv pip install --system check-manifest pytest-cov pytest
    - name: Install pytest-regsmart
      run: |
        uv pip install --system "$REGSMART_PACKAGE"
        uv pip freeze --system
    - name: Try building with Python build
      run: |
        python -m build
        shasum -a 256 dist/*
    - name: Check manifest
      run: check-manifest

    - name: Install entry point compatible code (TEMPORARY, April 2024)
      if: matrix.want-latest-entry-point-code
      run: |
        uv pip list --system
        # Not installing matplotlib's entry point code as building matplotlib from source is complex.
        # Rely upon matplotlib to test all the latest entry point branches together.
        uv pip install --system git+https://github.com/ipython/matplotlib-inline.git@main
        uv pip list --system

    - name: Cache pytest last-failed
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: .pytest_cache/v/cache/lastfailed
        key: pytest-lastfailed-${{ matrix.python-version }}-${{ matrix.deps }}-${{ github.run_id }}
        restore-keys: |
          pytest-lastfailed-${{ matrix.python-version }}-${{ matrix.deps }}-

    - name: Restore pytest-regsmart cache
      id: restore-pytest-regsmart-cache
      uses: actions/cache/restore@v4
      with:
        path: ${{ github.workspace }}/.pytest_cache/v/pytest_ranked_selection_data
        key: pytest-regsmart-cache-${{ github.workflow }}-${{ runner.os }}-${{ matrix.mode }}
        restore-keys: |
          pytest-regsmart-cache-${{ github.workflow }}-${{ runner.os }}-${{ matrix.mode }}-

    - name: pytest
      env:
        COLUMNS: 120
      run: |
        pytest --regsmart --ranking-weight=${{ matrix.weight }} --color=yes -raXxs

    - name: Save pytest-regsmart cache
      if: always()
      uses: actions/cache/save@v4
      with:
        path: ${{ github.workspace }}/.pytest_cache/v/pytest_ranked_selection_data
        key: pytest-regsmart-cache-${{ github.workflow }}-${{ runner.os }}-${{ matrix.mode }}-${{ github.run_id }}
