name: Run tests

on:
  push:
    branches:
      - main
      - '*.x'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.12"]
        deps: [test_extra]
        # Test all on ubuntu, test ends on macos
        include:
          # Tests latest development Python version
          - os: ubuntu-latest
            python-version: "3.12"
            deps: test_extra
            want-latest-entry-point-code: true

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        persist-credentials: false
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
      with:
        python-version: ${{ matrix.python-version }}
        cache: pip
        cache-dependency-path: |
          pyproject.toml
    - name: Install uv
      uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
    - name: Install and update Python dependencies (binary only)
      if: ${{ ! contains( matrix.python-version, 'dev' ) }}
      run: |
        uv pip install --system setuptools wheel build
        uv pip install --system -e .[${{ matrix.deps }}]
        uv pip install --system check-manifest pytest-cov pytest
    - name: Try building with Python build
      run: |
        python -m build
        shasum -a 256 dist/*
    - name: Check manifest
      run: check-manifest

    - name: Install entry point compatible code (TEMPORARY, April 2024)
      if: matrix.want-latest-entry-point-code
      run: |
        uv pip list --system
        # Not installing matplotlib's entry point code as building matplotlib from source is complex.
        # Rely upon matplotlib to test all the latest entry point branches together.
        uv pip install --system git+https://github.com/ipython/matplotlib-inline.git@main
        uv pip list --system

    - name: Cache pytest last-failed
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: .pytest_cache/v/cache/lastfailed
        key: pytest-lastfailed-${{ matrix.os }}-${{ matrix.python-version }}-${{ matrix.deps }}-${{ github.run_id }}
        restore-keys: |
          pytest-lastfailed-${{ matrix.os }}-${{ matrix.python-version }}-${{ matrix.deps }}-

    - name: pytest
      env:
        COLUMNS: 120
      run: |
        pytest --color=yes -raXxs --cov --cov-report=xml --ff --maxfail=5
